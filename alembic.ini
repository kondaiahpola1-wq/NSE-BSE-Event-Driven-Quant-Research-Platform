# Alembic configuration for NSE-BSE Quant Research Platform
# Usage:
#   alembic upgrade head     # apply all pending migrations
#   alembic downgrade -1     # rollback last migration
#   alembic revision --autogenerate -m "description"  # create new migration

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://postgres:quant2026@localhost:5432/postgres

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
