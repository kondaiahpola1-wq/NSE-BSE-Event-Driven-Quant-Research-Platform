[project]
name = "indian-quant"
version = "0.1.0"
description = "Indian quant research & market infrastructure: NSE/BSE data acquisition, canonical contracts, quality engine, NautilusTrader backtesting, Upstox connectivity."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Quant Research" }]
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "nautilus_trader>=1.224",
    "protobuf>=5.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "finstack-mcp>=0.10.0",
    "mcp<2",
    "indian-market-mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indian_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "indian_quant.adapters.upstox.proto.*"
follow_imports = "skip"
ignore_errors = true
